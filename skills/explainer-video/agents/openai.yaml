interface:
  display_name: "Explainer Video"
  short_description: "Narrated motion-graphics explainer"
  icon_small: "./assets/icon.png"
  brand_color: "#FF00FF"
  default_prompt: "Make an explainer video for my app's new feature"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "cliptalk"
      description: "ClipTalk video tools"
      transport: "streamable_http"
      url: "https://www.cliptalk.pro/mcp"
