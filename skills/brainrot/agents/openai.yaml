interface:
  display_name: "Brainrot"
  short_description: "Narrated facts and stories over looping footage"
  icon_small: "./assets/icon.png"
  brand_color: "#FF00FF"
  default_prompt: "Make a brainrot video about weird space facts"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "cliptalk"
      description: "ClipTalk video tools"
      transport: "streamable_http"
      url: "https://www.cliptalk.pro/mcp"
